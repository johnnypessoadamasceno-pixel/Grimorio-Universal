name: Compilar APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Grimorio_Site_HD/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Conferir arquivos do Grimório
        run: |
          test -s Grimorio_Site_HD/index.html || { echo "::error::Falta Grimorio_Site_HD/index.html"; exit 1; }
          test -d Grimorio_Site_HD/assets || { echo "::error::Falta a pasta Grimorio_Site_HD/assets"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Criar projeto Android
        run: npx cap add android && npx cap sync android
      - name: Compilar APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Grimorio-Android-Instalavel
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
