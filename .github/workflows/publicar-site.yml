name: Publicar site do Grimório
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'pacote/**'
      - 'icone.svg'
      - 'robots.txt'
      - '.github/workflows/publicar-site.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar os arquivos
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Montar os arquivos do site
        run: |
          mkdir -p _site/pacote
          cp index.html icone.svg robots.txt _site/
          cp pacote/parte-*.txt _site/pacote/
          test $(find _site/pacote -name 'parte-*.txt' | wc -l) -eq 11
      - name: Enviar site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
